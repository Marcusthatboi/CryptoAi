services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    command: ["mongod", "--bind_ip_all", "--wiredTigerCacheSizeGB", "1"]
    volumes:
      - mongo_data:/data/db
    networks:
      - cryptoai_net

  backend_a:
    build:
      context: .
      dockerfile: Dockerfile.backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MONGODB_URL: mongodb://mongo:27017
      DB_NAME: cryptoai
      APP_ENV: production
      ENVIRONMENT: production
      MONGO_MAX_POOL_SIZE: 300
      MONGO_MIN_POOL_SIZE: 20
      MAX_WS_CONNECTIONS: 2000
    depends_on:
      - mongo
    expose:
      - "8002"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8002/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    networks:
      - cryptoai_net

  backend_b:
    build:
      context: .
      dockerfile: Dockerfile.backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MONGODB_URL: mongodb://mongo:27017
      DB_NAME: cryptoai
      APP_ENV: production
      ENVIRONMENT: production
      MONGO_MAX_POOL_SIZE: 300
      MONGO_MIN_POOL_SIZE: 20
      MAX_WS_CONNECTIONS: 2000
    depends_on:
      - mongo
    expose:
      - "8002"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8002/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    networks:
      - cryptoai_net

  api_gateway:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - backend_a
      - backend_b
    ports:
      - "8002:80"
    volumes:
      - ./deploy/nginx/api-gateway.conf:/etc/nginx/conf.d/default.conf:ro
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
    security_opt:
      - no-new-privileges:true
    networks:
      - cryptoai_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-https://api.dacryptobeast.com}
        VITE_WS_URL: ${VITE_WS_URL:-wss://api.dacryptobeast.com/ws}
    restart: unless-stopped
    depends_on:
      - api_gateway
    ports:
      - "8080:8080"
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
    security_opt:
      - no-new-privileges:true
    networks:
      - cryptoai_net

volumes:
  mongo_data:

networks:
  cryptoai_net:
    driver: bridge
