apiVersion: apps/v1
kind: Deployment
metadata:
  name: cryptoai-frontend
  namespace: cryptoai
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cryptoai-frontend
  template:
    metadata:
      labels:
        app: cryptoai-frontend
    spec:
      containers:
        - name: frontend
          image: cryptoai-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: cryptoai-frontend
  namespace: cryptoai
spec:
  selector:
    app: cryptoai-frontend
  ports:
    - port: 80
      targetPort: 8080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cryptoai-ingress
  namespace: cryptoai
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "75"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "75"
spec:
  rules:
    - host: cryptoai.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: cryptoai-frontend
                port:
                  number: 80
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: cryptoai-backend
                port:
                  number: 8002
          - path: /auth
            pathType: Prefix
            backend:
              service:
                name: cryptoai-backend
                port:
                  number: 8002
