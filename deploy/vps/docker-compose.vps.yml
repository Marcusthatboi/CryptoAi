services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    networks:
      - cryptoai_net

  backend:
    build:
      context: ../..
      dockerfile: Dockerfile.backend
    restart: unless-stopped
    depends_on:
      - mongo
    env_file:
      - path: .env.vps
        format: raw
    environment:
      MONGODB_URL: mongodb://mongo:27017
      DB_NAME: ${DB_NAME:-cryptoai}
      APP_ENV: production
      ENVIRONMENT: production
      MONGO_MAX_POOL_SIZE: ${MONGO_MAX_POOL_SIZE:-200}
      MONGO_MIN_POOL_SIZE: ${MONGO_MIN_POOL_SIZE:-20}
      MAX_WS_CONNECTIONS: ${MAX_WS_CONNECTIONS:-2000}
    expose:
      - "8002"
    networks:
      - cryptoai_net

  frontend:
    build:
      context: ../../frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: https://${API_DOMAIN:-api.dacryptobeast.com}
        VITE_WS_URL: wss://${API_DOMAIN:-api.dacryptobeast.com}/ws
    restart: unless-stopped
    depends_on:
      - backend
    expose:
      - "8080"
    networks:
      - cryptoai_net

  caddy:
    image: caddy:2.8
    restart: unless-stopped
    depends_on:
      - frontend
      - backend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    env_file:
      - path: .env.vps
        format: raw
    networks:
      - cryptoai_net

volumes:
  mongo_data:
  caddy_data:
  caddy_config:

networks:
  cryptoai_net:
    driver: bridge
